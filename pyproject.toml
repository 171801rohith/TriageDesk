[project]
name = "triagedesk"
version = "0.1.0"
description = "AI-assisted support-ticket triage API (FastAPI + PostgreSQL/pgvector + LangChain)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141",     # includes uvicorn, email-validator
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.3",
    "pgvector>=0.5",
    "alembic>=1.20",
    "pydantic-settings>=2.15",
    "langchain-core>=1.6,<2",
    "langchain-text-splitters>=1.1,<2",
    "langchain-google-genai>=4.4,<5",
    "langchain-ollama>=1.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "httpx>=0.28",
    "ruff",
    "numpy>=2.5.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Only the `app` package is installable; scripts/, tests/, alembic/ and data/ are not.
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs a real PostgreSQL test database (triagedesk_test)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Don't reformat code samples in the design docs, or Alembic-generated migrations.
extend-exclude = ["*.md", "alembic/versions"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends(...)` / `Query(...)` defaults are the intended DI pattern.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
